<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Alunos - Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- CABEÇALHO COM ABAS DE NAVEGAÇÃO -->
    <header>
        <h1>Sistema Acadêmico</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="alunos.html" class="active" id="link-alunos">Alunos</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="matriculas.html">Matrículas</a></li>
                <li><a href="usuarios.html">Usuários</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <!-- SEÇÃO DE CADASTRO DE ALUNO -->
        <section>
            <h2>Gerenciamento de Alunos</h2>

            <h3>Cadastrar Novo Aluno</h3>
            <form id="form-aluno">
                <input type="text" id="nome-aluno" placeholder="Nome do Aluno" required>
                <input type="text" id="curso-aluno" placeholder="Curso" required>
                <select id="status-aluno">
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
                <button type="submit">Adicionar Aluno</button>
            </form>
        </section>

        <hr>

        <!-- SEÇÃO DE FILTROS -->
        <section>
            <h2>Filtrar Alunos</h2>
            <div class="filtros-container" style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px; background: #ffffff; padding: 15px; border-radius: 8px; border: 1px solid #f8bbd0; align-items: center;">
                <div style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 220px;">
                    <label for="busca" style="font-size: 0.85rem; font-weight: bold; color: #880e4f;">Pesquisar por nome:</label>
                    <input id="busca" type="search" placeholder="Digite o nome">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 220px;">
                    <label for="filtro-status" style="font-size: 0.85rem; font-weight: bold; color: #880e4f;">Status:</label>
                    <select id="filtro-status">
                        <option value="">Todos</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- ÁREA DE DETALHES DO ALUNO -->
        <section id="detalhes-aluno" class="card" style="margin: 20px 0; padding: 15px; border: 1px solid #f8bbd0;">
            <h3>Detalhes do Aluno</h3>
            <p><strong>Nome:</strong> <span id="detalhe-nome">-</span></p>
            <p><strong>Curso:</strong> <span id="detalhe-curso">-</span></p>
            <p><strong>Status:</strong> <span id="detalhe-status">-</span></p>
        </section>

        <hr>

        <!-- LISTA DE ALUNOS -->
        <section>
            <h3>Lista de Alunos</h3>
            <div id="lista-alunos" class="lista-grid"></div>
        </section>
    </main>

    <footer>
        <p>Sistema Acadêmico - Desenvolvido com Tema Rosa Elegante</p>
    </footer>

    <!-- Scripts necessários -->
    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
