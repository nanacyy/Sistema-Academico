<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Alunos - Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sistema Acadêmico</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="alunos.html" class="active">Alunos</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="matriculas.html">Matrículas</a></li>
                <li><a href="usuarios.html">Usuários</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Gerenciamento de Alunos</h2>

        <section>
            <h3>Cadastrar Novo Aluno</h3>
            <form id="form-aluno">
                <input type="text" id="nome-aluno" placeholder="Nome do Aluno" required>
                <input type="text" id="curso-aluno" placeholder="Curso" required>
                <select id="status-aluno">
                    <option value="ativo">Ativo</option>
                    <option value="inativo">Inativo</option>
                </select>
                <button type="submit">Adicionar Aluno</button>
            </form>
        </section>

        <section>
            <h3>Filtrar Alunos</h3>
            <div style="display: flex; gap: 15px; flex-wrap: wrap; margin-bottom: 20px;">
                <div style="flex: 1;">
                    <label for="busca">Pesquisar por nome:</label>
                    <input id="busca" type="search" placeholder="Digite o nome" style="width: 100%;">
                </div>
                <div style="flex: 1;">
                    <label for="filtro-status">Status:</label>
                    <select id="filtro-status" style="width: 100%;">
                        <option value="">Todos</option>
                        <option value="ativo">Ativo</option>
                        <option value="inativo">Inativo</option>
                    </select>
                </div>
            </div>
        </section>

        <section id="detalhes-aluno" class="card" style="margin: 20px 0;">
            <h3>Detalhes do Aluno</h3>
            <p><strong>Nome:</strong> <span id="detalhe-nome">-</span></p>
            <p><strong>Curso:</strong> <span id="detalhe-curso">-</span></p>
            <p><strong>Status:</strong> <span id="detalhe-status">-</span></p>
        </section>

        <hr>

        <section>
            <h3>Lista de Alunos</h3>
            <div id="lista-alunos" class="lista-grid"></div>
        </section>
    </main>

    <footer>
        <p>Sistema Acadêmico - Desenvolvimento Web I</p>
    </footer>

    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
