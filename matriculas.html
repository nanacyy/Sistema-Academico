<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Matrículas - Sistema Acadêmico</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Sistema Acadêmico</h1>
        <nav>
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="alunos.html">Alunos</a></li>
                <li><a href="cursos.html">Cursos</a></li>
                <li><a href="matriculas.html" class="active">Matrículas</a></li>
                <li><a href="usuarios.html">Usuários</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h2>Gerenciamento de Matrículas</h2>

        <section>
            <h3>Cadastrar Nova Matrícula</h3>
            <form id="form-matricula">
                <input type="text" id="aluno-matricula" placeholder="Nome do Aluno" required>
                <input type="text" id="curso-matricula" placeholder="Nome do Curso" required>
                <input type="text" id="turno-matricula" placeholder="Turno (ex: Manhã, Noite)" required>
                <select id="status-matricula">
                    <option value="Ativa">Ativa</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Trancada">Trancada</option>
                </select>
                <button type="submit">Adicionar Matrícula</button>
            </form>
        </section>

        <hr>

        <section>
            <h3>Lista de Matrículas</h3>
            <div id="lista-matriculas" class="lista-grid"></div>
        </section>
    </main>

    <footer>
        <p>Sistema Acadêmico - Desenvolvimento Web I</p>
    </footer>

    <script src="js/dados.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
